services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # API (s3-compatible)
      - "9001:9001"   # Web UI (console)
    env_file:
      - ../.dev.env
    environment:
      MINIO_ROOT_USER: ${MINIO__LOGIN}        # логин
      MINIO_ROOT_PASSWORD: ${MINIO__PASSWORD} # пароль
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - backend

volumes:
  minio_data:

networks:
  backend:
    driver: bridge